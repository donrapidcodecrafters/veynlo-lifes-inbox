name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veynlo
          POSTGRES_PASSWORD: veynlo_dev_password
          POSTGRES_DB: veynlo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U veynlo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://veynlo:veynlo_dev_password@localhost:5433/veynlo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@veynlo/core" --filter "@veynlo/design-tokens" --filter "@veynlo/db" --filter "@veynlo/authz" run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm -r run test

      - name: Build remaining apps/services
        run: pnpm --filter "@veynlo/api" --filter "@veynlo/web" run build
