name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veynlo
          POSTGRES_PASSWORD: veynlo_dev_password
          POSTGRES_DB: veynlo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U veynlo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://veynlo:veynlo_dev_password@localhost:5433/veynlo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational, not blocking: today's findings are all in dev-only build tooling (Next.js/postcss,
      # Expo/metro's image parsing), not runtime attack surface for the deployed API — a hard gate here
      # would break every build on a pre-existing transitive-dependency vuln nobody's triaged yet. Findings
      # still show up in every CI run so they don't silently rot; see SECURITY.md for the pre-submission
      # checklist this should be resolved against before a real store submission or pentest.
      - name: Dependency vulnerability scan (informational)
        run: pnpm audit --audit-level=high || true

      - name: Build shared packages
        run: pnpm --filter "@veynlo/core" --filter "@veynlo/design-tokens" --filter "@veynlo/db" --filter "@veynlo/authz" run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm -r run test

      - name: Build remaining apps/services
        run: pnpm --filter "@veynlo/api" --filter "@veynlo/web" --filter "@veynlo/admin" run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      # Blocking, not informational — verified 0 findings against the current codebase (2026-08-28), so
      # there's no pre-existing noise to grandfather. A new finding here is a new problem, not old debt.
      #
      # Runs the OSS gitleaks binary directly via its official image rather than gitleaks/gitleaks-action@v2:
      # that wrapper action started enforcing a GITLEAKS_LICENSE requirement for private repositories
      # (this repo only got a GitHub remote this session, so this step had never actually run for real
      # before it hit that wall) — a real signup/paid dependency this project has no reason to take on when
      # the underlying scanner is free. Same rules, same blocking behavior, zero cost.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact -v

      # Same free, no-login Semgrep Registry rulesets verified locally (0 findings after fixing the two
      # real GCM auth-tag-length issues these caught in field-encryption.ts/credential-vault.ts) — blocking
      # for the same reason as gitleaks above: nothing pre-existing to grandfather.
      - name: SAST (semgrep)
        run: |
          pip install semgrep
          semgrep --config=p/security-audit --config=p/secrets --config=p/owasp-top-ten \
            --exclude=node_modules --exclude='**/node_modules' --exclude=dist --exclude='**/dist' \
            --error services/api packages apps/web apps/admin

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds both images on every PR — this is what actually caught three real, reproducible bugs
      # (a leaking .tsbuildinfo file, pnpm v10's deploy default, an unused-patch failure) that typechecking
      # alone never would have; a broken Dockerfile should fail CI the same day it breaks, not at the next
      # real deploy attempt. No registry push configured yet — see docs/DEPLOYMENT.md once ECR exists.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          target: api
          push: false
          load: true # without this the image only exists inside BuildKit's own cache, never in the
          # local Docker daemon — the SBOM step below scans it by tag via `docker`, which needs it loaded.
          tags: veynlo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          target: worker
          push: false
          load: true
          tags: veynlo-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Archived per build, not gated on — an SBOM is evidence for the pre-submission checklist in
      # SECURITY.md, not something with a pass/fail threshold of its own.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: veynlo-api:ci
          format: cyclonedx-json
          output-file: sbom-api.cyclonedx.json
          upload-artifact: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Only needs to run once — not per-environment — so it's pinned to one matrix leg.
      - name: Format check
        if: matrix.environment == 'dev'
        run: terraform fmt -check -recursive -diff infrastructure/terraform

      # No AWS account exists yet (see infrastructure/terraform/README.md), so there's no backend and no
      # credentials here — `init -backend=false` + `validate` need neither, unlike `plan`/`apply`.
      - name: Init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      # Informational only, not blocking: real findings here (VPC flow logs, S3 versioning/replication, ALB
      # WAF, Secrets Manager rotation, RDS backup plan, ...) are genuine hardening gaps, but several are
      # deliberately deferred/Tier-3 scope for this project stage (AWS WAF has real ongoing runtime cost;
      # see docs/DEPLOYMENT.md and SECURITY.md) rather than oversights to gate merges on. Surfacing them
      # keeps the backlog visible without blocking on remediation work that isn't in scope yet.
      - name: Security scan (checkov, informational)
        if: matrix.environment == 'dev'
        run: |
          pip install checkov
          checkov -d infrastructure/terraform --framework terraform --compact --quiet || true
