name: veynlo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veynlo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veynlo
      POSTGRES_PASSWORD: veynlo_dev_password
      POSTGRES_DB: veynlo
    ports:
      # Host port 5432 is often already taken by a locally-installed Postgres — publish on 5433 instead so
      # this stack never fights an unrelated service for the port.
      - "5433:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veynlo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veynlo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: veynlo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veynlo
      MINIO_ROOT_PASSWORD: veynlo_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: veynlo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
