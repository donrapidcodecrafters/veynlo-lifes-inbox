<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veynlo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <span class="brand-dot"></span>
        <span class="brand-name">Veynlo</span>
      </header>

      <section id="signed-out-view" class="view hidden">
        <p class="lede">Sign in to save pages to your Veynlo inbox.</p>
        <form id="sign-in-form" class="stack">
          <label class="field">
            <span>Email</span>
            <input type="email" id="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" id="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="primary">Sign in</button>
          <p id="sign-in-error" class="error hidden"></p>
        </form>
      </section>

      <section id="signed-in-view" class="view hidden">
        <p class="lede" id="account-email"></p>
        <div class="stack">
          <button id="save-page" class="primary">Save this page</button>
          <button id="save-selection" class="secondary">Save selected text</button>
        </div>
        <p id="save-status" class="status hidden"></p>

        <div class="stack">
          <!-- §29.1 SAVE-001 "Save anything... page/link" — distinct from "Save this page" above, which
               files an Inbox item via the email-style ingestion pipeline. This saves directly into the
               Saved Memory system (POST /v1/memories): private by default, auto-classified into a
               category (product/place/recipe/etc.), and searchable/resurfaced from the Saved tab. -->
          <button id="save-to-saved" class="secondary">Save to Saved</button>
        </div>
        <p id="save-to-saved-status" class="status hidden"></p>

        <div class="stack quick-list">
          <label class="field">
            <span>Quick list</span>
            <select id="quick-list-select"></select>
          </label>
          <button id="add-to-list" class="secondary">Add page to list</button>
          <p id="quick-list-status" class="status hidden"></p>
        </div>

        <button id="sign-out" class="link">Sign out</button>
      </section>

      <section id="loading-view" class="view">
        <p class="lede">Loading…</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
